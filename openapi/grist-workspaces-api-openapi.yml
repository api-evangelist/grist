openapi: 3.2.0
info:
  description: 'An API for manipulating Grist sites, workspaces, and documents.


    # Authentication'
  version: 1.0.1
  title: Grist Workspaces API
servers:
- url: https://{gristhost}/api
  variables:
    subdomain:
      description: The team name, or `docs` for personal areas
      default: docs
security:
- ApiKey: []
tags:
- name: Workspaces
  description: Sites can be organized into groups of documents called workspaces.
paths:
  /orgs/{orgId}/workspaces:
    get:
      operationId: listWorkspaces
      tags:
      - Workspaces
      summary: List workspaces and documents within an org
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        200:
          description: An org's workspaces and documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceWithDocsAndDomain'
    post:
      operationId: createWorkspace
      tags:
      - Workspaces
      summary: Create an empty workspace
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        description: settings for the workspace
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceParameters'
        required: true
      responses:
        200:
          description: The workspace id
          content:
            application/json:
              schema:
                type: integer
                description: an identifier for the workspace
                example: 155
  /workspaces/{workspaceId}:
    get:
      operationId: describeWorkspace
      tags:
      - Workspaces
      summary: Describe a workspace
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      responses:
        200:
          description: A workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceWithDocsAndOrg'
    patch:
      operationId: modifyWorkspace
      tags:
      - Workspaces
      summary: Modify a workspace
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      requestBody:
        description: the changes to make
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceParameters'
        required: true
      responses:
        200:
          description: Success
    delete:
      operationId: deleteWorkspace
      tags:
      - Workspaces
      summary: Delete a workspace
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      responses:
        200:
          description: Success
  /workspaces/{workspaceId}/remove:
    post:
      operationId: removeWorkspace
      tags:
      - Workspaces
      summary: Move workspace to trash
      description: 'Soft-delete the workspace by moving it to trash. The workspace can be

        restored using the unremove endpoint. If the `permanent` query parameter

        is set to true, the workspace is permanently deleted instead.'
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      - in: query
        name: permanent
        schema:
          type: boolean
        description: If true, permanently delete instead of moving to trash
      responses:
        200:
          description: Workspace moved to trash (or permanently deleted)
  /workspaces/{workspaceId}/unremove:
    post:
      operationId: unremoveWorkspace
      tags:
      - Workspaces
      summary: Restore workspace from trash
      description: 'Recover a workspace that was previously soft-deleted. Only works if the

        workspace is still in the trash.'
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      responses:
        200:
          description: Workspace restored successfully
  /workspaces/{workspaceId}/access:
    get:
      operationId: listWorkspaceAccess
      tags:
      - Workspaces
      summary: List users with access to workspace
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      responses:
        200:
          description: Users with access to workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccessRead'
    patch:
      operationId: modifyWorkspaceAccess
      tags:
      - Workspaces
      summary: Change who has access to workspace
      parameters:
      - $ref: '#/components/parameters/workspaceIdPathParam'
      requestBody:
        description: the changes to make
        content:
          application/json:
            schema:
              type: object
              required:
              - delta
              properties:
                delta:
                  $ref: '#/components/schemas/WorkspaceAccessWrite'
        required: true
      responses:
        200:
          description: Success
components:
  schemas:
    WorkspaceWithDocs:
      allOf:
      - $ref: '#/components/schemas/Workspace'
      - type: object
        required:
        - docs
        properties:
          docs:
            type: array
            items:
              $ref: '#/components/schemas/Doc'
    WorkspaceAccessRead:
      type: object
      required:
      - maxInheritedRole
      - users
      properties:
        maxInheritedRole:
          $ref: '#/components/schemas/Access'
        users:
          type: array
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: Andrea
              email:
                type: string
                example: andrea@getgrist.com
              access:
                $ref: '#/components/schemas/Access'
              parentAccess:
                $ref: '#/components/schemas/Access'
    Workspace:
      type: object
      required:
      - id
      - name
      - access
      properties:
        id:
          type: integer
          format: int64
          example: 97
        name:
          type: string
          example: Secret Plans
        access:
          type: string
          $ref: '#/components/schemas/Access'
    WorkspaceWithDocsAndOrg:
      allOf:
      - $ref: '#/components/schemas/WorkspaceWithDocs'
      - $ref: '#/components/schemas/WorkspaceWithOrg'
    WorkspaceWithDocsAndDomain:
      allOf:
      - $ref: '#/components/schemas/WorkspaceWithDocs'
      - type: object
        properties:
          orgDomain:
            type: string
            example: gristlabs
    WorkspaceAccessWrite:
      type: object
      properties:
        maxInheritedRole:
          $ref: '#/components/schemas/Access'
        users:
          type: object
          additionalProperties:
            type: string
            enum:
            - owners
            - editors
            - viewers
            - members
            - null
          example:
            foo@getgrist.com: owners
            bar@getgrist.com: null
    Access:
      type: string
      enum:
      - owners
      - editors
      - viewers
    Doc:
      type: object
      required:
      - id
      - name
      - isPinned
      - urlId
      - access
      properties:
        id:
          type: string
          example: 145
        name:
          type: string
          example: Project Lollipop
        access:
          type: string
          $ref: '#/components/schemas/Access'
        isPinned:
          type: boolean
          example: true
        urlId:
          type:
          - string
          - 'null'
          example: null
    WorkspaceParameters:
      type: object
      properties:
        name:
          type: string
          example: Retreat Docs
    Org:
      type: object
      required:
      - id
      - name
      - domain
      - owner
      - createdAt
      - updatedAt
      - access
      properties:
        id:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: Grist Labs
        domain:
          type:
          - string
          - 'null'
          example: gristlabs
        owner:
          type:
          - object
          - 'null'
          $ref: '#/components/schemas/User'
        access:
          type: string
          $ref: '#/components/schemas/Access'
        createdAt:
          type: string
          example: '2019-09-13T15:42:35.000Z'
        updatedAt:
          type: string
          example: '2019-09-13T15:42:35.000Z'
    WorkspaceWithOrg:
      allOf:
      - $ref: '#/components/schemas/Workspace'
      - type: object
        required:
        - org
        properties:
          org:
            $ref: '#/components/schemas/Org'
    User:
      type: object
      required:
      - id
      - name
      - picture
      properties:
        id:
          type: integer
          format: int64
          example: 101
        name:
          type: string
          example: Helga Hufflepuff
        picture:
          type:
          - string
          - 'null'
          example: null
  parameters:
    workspaceIdPathParam:
      in: path
      name: workspaceId
      description: An integer id
      schema:
        type: integer
      required: true
    orgIdPathParam:
      in: path
      name: orgId
      schema:
        oneOf:
        - type: integer
        - type: string
      description: This can be an integer id, or a string subdomain (e.g. `gristlabs`), or `current` if the org is implied by the domain in the url
      required: true
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: 'Authorization: Bearer XXXXXXXXXXX'
      description: Access to the Grist API is controlled by an Authorization header, which should contain the word 'Bearer', followed by a space, followed by your API key.
